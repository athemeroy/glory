window.__componentProbe=async(clsId,vertex,pose='bind',sample=null)=>{

  document.querySelector('#label').textContent=`${clsId} · ${pose} · connected component at ${vertex}\n${members.length} vertices / ${triangles.length/3} triangles · cyan translucent highlight\nFront / Side / Rear — First person below`;
  return metric;
};
