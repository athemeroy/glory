<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head><body><pre id="result">检查中…</pre><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/GLTFLoader.js';
import { loadClipLibrary, createMocapBody, retargetClip, MocapAnimator, handSocket, mountMocapWeapon, splitForFirstPerson } from '../src/game/mocap.js';
import { FPView } from '../src/game/fpview.js';
import { buildCharacter } from '../src/game/model.js';
import { Animator } from '../src/game/anim.js';
window.__errors = [];
try {
  await loadClipLibrary('../assets/anim/anims.glb');
  const loader = new GLTFLoader();
  const source = (await loader.loadAsync('../assets/anim/anims.glb')).scene;
  const tracks = [];
  source.traverse(o => {
    if (o.name && o.parent) tracks.push(new THREE.QuaternionKeyframeTrack(o.name + '.quaternion', [0, 1], [...o.quaternion.toArray(), ...o.quaternion.toArray()]));
  });
  const bindClip = new THREE.AnimationClip('bind-pose', 1, tracks);
  const before = JSON.stringify(bindClip.toJSON());
  const names = await (await fetch('../assets/models/rigged/manifest.json')).json();
  const results = [];
  for (const name of names) {
    const gltf = await loader.loadAsync(`../assets/models/rigged/${name}.glb`);
    const body = createMocapBody(gltf.scene);
    for (const side of ['Right', 'Left']) {
      const socket = handSocket(body, side), hand = body.bones[side + 'Hand'];
      const distance = hand.localToWorld(socket.clone()).distanceTo(hand.getWorldPosition(new THREE.Vector3()));
      if (!socket.toArray().every(Number.isFinite) || distance < 0.01 || distance > 0.2) throw Error(name + ': 握持中心异常 ' + distance);
      const weapon = new THREE.Group();
      const mount = mountMocapWeapon(body, side, weapon, 0);
      body.model.updateMatrixWorld(true);
      if (weapon.getWorldPosition(new THREE.Vector3()).distanceTo(hand.localToWorld(socket.clone())) > 1e-5) throw Error(name + ': 武器位置异常');
      mount.removeFromParent();
    }
    const fp = new FPView({}, 'sword', {}, gltf.scene);
    if (!fp.mc) throw Error(name + ': 第一人称手臂未启用');
    if (fp.gripHands?.length !== 2 || fp.gripHands.some(hand => hand.joints.length !== 14)) throw Error(name + ': 缺少指节骨');
    for (const hand of fp.gripHands) {
      for (const amount of [0, 0.5, 1]) {
        hand.setGrip(amount);
        if (hand.joints.some(({bone})=>!bone.quaternion.toArray().every(Number.isFinite))) throw Error(name + ': 指节姿态异常');
      }
    }
    const procedural = buildCharacter({});
    for (const twist of [-1, 0, 1]) {
      procedural.bones.haR.rotation.y = twist;
      fp.sync(procedural, 1/60);
      fp.root.updateMatrixWorld(true);
      const expected = fp.rig.bones.haR.getWorldQuaternion(new THREE.Quaternion()).multiply(fp.mc.handFrames.Right);
      const actual = fp.mc.B.RightHand.getWorldQuaternion(new THREE.Quaternion());
      if (expected.angleTo(actual)>0.001) throw Error(name + ': 手腕扭转丢失');
      if (!fp.weapon.obj.getWorldPosition(new THREE.Vector3()).toArray().every(Number.isFinite)) throw Error(name + ': 第一人称武器坐标异常');
      for (const [i, side] of ['Right', 'Left'].entries()) {
        const hand = fp.gripHands[i];
        const gripPosition = hand.root.localToWorld(hand.grip.clone());
        const palmPosition = fp.mc.B[side + 'Hand'].localToWorld(fp.mc.palms[side].clone());
        if (gripPosition.distanceTo(palmPosition)>1e-5) throw Error(name + ': 手型与握持中心分离');
        if (i === 0) {
          const fingers = new THREE.Vector3(0,0,1).applyQuaternion(hand.root.getWorldQuaternion(new THREE.Quaternion()));
          const handle = new THREE.Vector3(0,1,0).applyQuaternion(fp.weapon.obj.getWorldQuaternion(new THREE.Quaternion()));
          if (fingers.angleTo(handle)>0.001) throw Error(name + ': 指列没有对齐握柄');
        }
      }
    }
    const rest = new Map(Object.entries(body.bones).map(([n,b]) => [n, {q:b.quaternion.clone(), p:b.position.clone()}]));
    const mixer = new THREE.AnimationMixer(body.model);
    const clip = retargetClip(bindClip, body.rest);
    mixer.clipAction(clip).play(); mixer.update(0.5);
    let maxAngle = 0;
    for (const [n,b] of Object.entries(body.bones)) {
      maxAngle = Math.max(maxAngle, b.quaternion.angleTo(rest.get(n).q));
      if (b.position.distanceTo(rest.get(n).p) > 1e-6) throw Error(name + ': 骨长改变');
    }
    if (maxAngle > 0.001) throw Error(name + ': 绑定姿态误差 ' + maxAngle);
    mixer.stopAllAction();
    const animator = new MocapAnimator(body);
    for (const c of ['Idle', 'Combat_Stance', 'Run_02', 'Right_Hand_Sword_Slash', 'Knock_Down']) {
      const a = animator.play(c, {manual:true, loop:false});
      if (!a) throw Error('缺少动作 ' + c);
      for (const t of [0, 0.3, 0.7, 0.99]) {
        a.time = t * a.getClip().duration; animator.mixer.update(0.2);
        for (const [n,b] of Object.entries(body.bones)) {
          if (!b.quaternion.toArray().every(Number.isFinite) || Math.abs(b.quaternion.length()-1)>0.001) throw Error(name + ': 旋转异常 ' + n);
          if (b.position.distanceTo(rest.get(n).p)>1e-6) throw Error(name + ': 动画改变骨长 ' + n);
        }
      }
    }
    animator.mixer.stopAllAction();
    animator.curName = '';
    const idle = {onGround:true, speed:0, calm:true};
    for (let i=0;i<60;i++) animator.update(1/60, idle);
    const hipY = body.bones.Hips.position.y;
    animator.update(0, {...idle, guard:true});
    if (Math.abs(body.bones.Hips.position.y-hipY)>0.001) throw Error(name + ': 切换动作时髋部跳变');
    for (let i=0;i<30;i++) animator.update(1/60, {...idle, guard:true});
    const original = [...body.meshes];
    const vertexCount = original.reduce((n,m)=>n+(m.geometry.index?.count || m.geometry.attributes.position.count),0);
    splitForFirstPerson(body);
    if (body.meshes.reduce((n,m)=>n+m.geometry.index.count,0)!==vertexCount) throw Error(name + ': 拆分丢失三角形');
    if (body.meshes.some(m=>!original.some(o=>o.geometry.attributes.position===m.geometry.attributes.position))) throw Error(name + ': 拆分复制了顶点');
    results.push(name + ': 动作、握持点、手腕扭转、网格拆分通过');
    fp.dispose();
    if (name === 'sharpshooter') {
      const guns = new FPView({}, 'pistol', {}, gltf.scene);
      const pose = buildCharacter({}), animator = new Animator(pose);
      for (let i=0;i<60;i++) animator.update(1/60, {stance:'pistol',onGround:true,speed:0});
      guns.sync(pose,1/60); guns.root.updateMatrixWorld(true);
      const right = guns.weapon.obj.getWorldPosition(new THREE.Vector3()), left = guns.left.getWorldPosition(new THREE.Vector3());
      if (Math.abs(right.x-left.x)<0.15) throw Error('双枪挤在画面中心');
      for (const gun of [guns.weapon.obj, guns.left]) {
        const barrel = new THREE.Vector3(0,1,0).applyQuaternion(gun.getWorldQuaternion(new THREE.Quaternion()));
        if (Math.abs(barrel.x)>0.001 || barrel.z>0) throw Error('双枪枪管偏离视线');
      }
      guns.dispose();
    }
    gltf.scene.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of [].concat(o.material)){m.map?.dispose();m.dispose();}}});
  }
  if (JSON.stringify(bindClip.toJSON()) !== before) throw Error('重定向污染源动作');
  window.__results = results;
  document.querySelector('#result').textContent = results.join('\n');
} catch (e) { window.__errors.push(String(e)); document.querySelector('#result').textContent = String(e); }
window.__ready = true;
</script></body></html>
