<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>剑客模型对比</title>
<style>body{margin:0;background:#101820;color:#e6e0d3;font:15px system-ui}canvas{display:block}header{position:absolute;top:22px;left:28px;z-index:1}h1{font-size:22px;margin:0 0 8px}p{color:#aebbbf;margin:6px 0}select,button,a{background:#24343e;color:#eee;border:1px solid #58656c;border-radius:5px;padding:8px;margin:8px 6px 0 0}label{position:absolute;bottom:26px;transform:translateX(-50%);font-size:18px}.old{left:30%}.new{left:70%}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
<header><h1>剑客 · 设计图样板</h1><p>拖动旋转 · 滚轮查看细节</p><select id="pose"><option value="idle">战斗待机</option><option value="rest">绑定姿势</option><option value="run">跑步</option><option value="pilotRise">上撩</option><option value="pilotSweep">横扫</option><option value="pilotChop">下劈</option></select><button id="freeze">暂停动作</button><a href="../../index.html?auto=training&acc=yysf&swordpilot=1&view=tp">进入游戏样板</a><p id="status">加载模型…</p></header>
<label class="old">当前默认</label><label class="new">设计图样板</label>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from '../../vendor/GLTFLoader.js';
import {loadClipLibrary,loadSwordPilotClips,createMocapBody,MocapAnimator} from '../../src/game/mocap.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#101820');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,30);camera.position.set(0,1.2,4.5);camera.lookAt(0,.9,0);
scene.add(new THREE.HemisphereLight('#ddefff','#46545c',2));const key=new THREE.DirectionalLight('#fff2d9',3);key.position.set(-3,4,5);scene.add(key);const rim=new THREE.DirectionalLight('#b2dbe7',2);rim.position.set(3,3,-3);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:'#24313a',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.015;scene.add(floor);
const roots=[],actors=[];const loader=new GLTFLoader();await loadClipLibrary('../../assets/anim/anims.glb');await loadSwordPilotClips('../../assets/anim/swordmaster-pilot.json');
for(const [url,x] of [['../../assets/models/rigged/swordmaster.glb',-.72],['../../assets/models/pilot/swordmaster.glb',.72]]){
 const gltf=await loader.loadAsync(url);gltf.scene.userData.gloryClass='swordmaster';
 const body=createMocapBody(gltf.scene),root=new THREE.Group();root.position.x=x;root.add(body.model);scene.add(root);roots.push(root);
 body.model.updateMatrixWorld(true);const mesh=body.meshes[0];mesh.skeleton.update();const restPositions=new Float32Array(mesh.geometry.attributes.position.count*3),v=new THREE.Vector3();
 for(let i=0;i<restPositions.length/3;i++)mesh.getVertexPosition(i,v).applyMatrix4(mesh.matrixWorld).toArray(restPositions,i*3);
 const restBones=Object.values(body.bones).map(bone=>({bone,position:bone.position.clone(),quaternion:bone.quaternion.clone()}));
 actors.push({body,anim:new MocapAnimator(body),restPositions,restBones});
}
let pose='idle',frozen=new URLSearchParams(location.search).has('freeze'),t=0,prev=performance.now(),drag=false,lastX=0;
document.querySelector('#pose').onchange=e=>{pose=e.target.value;t=0};document.querySelector('#freeze').onclick=()=>{frozen=!frozen;document.querySelector('#freeze').textContent=frozen?'继续动作':'暂停动作'};
renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag){for(const root of roots)root.rotation.y+=(e.clientX-lastX)*.008;lastX=e.clientX}};
renderer.domElement.onwheel=e=>{e.preventDefault();camera.position.z=THREE.MathUtils.clamp(camera.position.z+e.deltaY*.003,1.5,7);camera.lookAt(0,.95,0)};
window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
function step(dt){t+=dt;for(const {body,anim,restBones} of actors){if(pose==='rest'){for(const r of restBones){r.bone.position.copy(r.position);r.bone.quaternion.copy(r.quaternion)}body.model.updateMatrixWorld(true);continue}const phase=(t%2.1)/2.1;const stage=phase<.3?'wind':phase<.5?'active':'recover';const at=stage==='wind'?phase/.3:stage==='active'?(phase-.3)/.2:(phase-.5)/.5;
 anim.update(dt,{onGround:true,speed:pose==='run'?5:0,stance:'sword',action:pose.startsWith('pilot')?{clip:pose,stage,t:at,key:Math.floor(t/2.1)}:null});body.model.updateMatrixWorld(true)}renderer.render(scene,camera)}
window.__compare={actors,renderer,camera,scene,setPose:p=>{pose=p;t=0},step};
document.querySelector('#status').textContent='模型已加载';window.__ready=true;
function loop(now){const dt=Math.min(.04,(now-prev)/1000);prev=now;step(frozen?0:dt);requestAnimationFrame(loop)}step(.3);requestAnimationFrame(loop);
</script></html>
