<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head>
<body><pre id="result">检查流氓破衣角绑定…</pre><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/GLTFLoader.js';
import * as SkeletonUtils from '../vendor/SkeletonUtils.js';
import { createMocapBody, loadClipLibrary, MocapAnimator, splitForFirstPerson } from '../src/game/mocap.js';
import { repairAttachmentWeights } from '../src/game/attachment.js';
import { buildCharacter, disposeRig } from '../src/game/model.js';
import { Animator } from '../src/game/anim.js';
import { CLASSES } from '../src/data/classes.js';
window.__errors=[];window.__results=[];window.__metrics=[];
const check=(value,label)=>{if(!value)throw Error(label);__results.push(label)};
const weights=geometry=>Array.from({length:geometry.attributes.skinIndex.count*4},(_,i)=>[geometry.attributes.skinIndex.getComponent(Math.floor(i/4),i%4),geometry.attributes.skinWeight.getComponent(Math.floor(i/4),i%4)]);
const point=(mesh,i)=>mesh.getVertexPosition(i,new THREE.Vector3()).applyMatrix4(mesh.matrixWorld);
const positions=body=>{body.model.updateMatrixWorld(true);const mesh=body.meshes[0];mesh.skeleton.update();return Array.from({length:mesh.geometry.attributes.position.count},(_,i)=>point(mesh,i))};
try {
  await loadClipLibrary('../assets/anim/anims.glb');const source=(await new GLTFLoader().loadAsync('../assets/models/rigged/thug.glb')).scene;
  let sourceMesh;source.traverse(object=>{if(object.isSkinnedMesh&&!sourceMesh)sourceMesh=object});const sourceGeometry=sourceMesh.geometry,original=JSON.stringify(weights(sourceGeometry));
  const baseline=createMocapBody(source),dominant=createMocapBody(source);source.userData.gloryClass='thug';const fixed=createMocapBody(source),before=baseline.meshes[0],after=fixed.meshes[0],mask=after.userData.attachmentComponent;
  check(fixed.attachment?.changed===62&&fixed.attachment.targetVertices===62,'统一入口只识别已认证62顶点破衣片');
  check(JSON.stringify(weights(sourceGeometry))===original&&sourceMesh.geometry===sourceGeometry,'原GLB权重与geometry不变');
  const si=before.geometry.attributes.skinIndex,sw=before.geometry.attributes.skinWeight,ai=after.geometry.attributes.skinIndex,aw=after.geometry.attributes.skinWeight,names=after.skeleton.bones.map(bone=>bone.name),leg=names.indexOf('RightLeg'),up=names.indexOf('RightUpLeg'),target=[];
  let legTotal=0,upTotal=0;for(let i=0;i<si.count;i++)if(mask[i]){target.push(i);for(let k=0;k<4;k++){if(si.getComponent(i,k)===leg)legTotal+=sw.getComponent(i,k);if(si.getComponent(i,k)===up)upTotal+=sw.getComponent(i,k)}}
  const legMean=legTotal/(legTotal+upTotal),upMean=1-legMean;check(legMean>.63&&legMean<.65,'保持原片平均小腿/大腿运动归属');
  for(let i=0;i<ai.count;i++)for(let k=0;k<4;k++) {
    if(!mask[i]&&(ai.getComponent(i,k)!==si.getComponent(i,k)||aw.getComponent(i,k)!==sw.getComponent(i,k)))throw Error('非目标片改变 '+i);
    if(mask[i]&&(ai.getComponent(i,k)!==[leg,up,0,0][k]||Math.abs(aw.getComponent(i,k)-[legMean,upMean,0,0][k])>1e-7))throw Error('同片权重不一致 '+i);
  }
  check(target.length===62,'62点全部使用统一凸组合，其余人体与衣片逐点原绑');
  const bind=positions(baseline),fixedBind=positions(fixed);check(Math.max(...bind.map((p,i)=>p.distanceTo(fixedBind[i])))<1e-5,'绑定形状不变');
  const repaired=fixed.attachment,geometry=after.geometry;check(repairAttachmentWeights(fixed,'thug')===repaired&&after.geometry===geometry,'修复重复调用幂等，不分配新geometry');
  const shared=createMocapBody(source);check(shared.meshes[0].geometry===geometry,'修复缓存只读共享');
  const guardSource=SkeletonUtils.clone(source);guardSource.traverse(object=>{if(object.isSkinnedMesh)object.geometry=object.geometry.clone()});guardSource.position.x+=.05;
  const guardBody=createMocapBody(guardSource);check(!guardBody.attachment,'同62点但绑定bounds变化的模型不会误修');
  const dominantMesh=dominant.meshes[0];dominantMesh.geometry=dominantMesh.geometry.clone();const di=dominantMesh.geometry.attributes.skinIndex,dw=dominantMesh.geometry.attributes.skinWeight;
  for(const i of target)for(let k=0;k<4;k++){di.setComponent(i,k,k===0?leg:0);dw.setComponent(i,k,k===0?1:0)}
  const index=before.geometry.index,edges=[],seen=new Set();for(let at=0;at<index.count;at+=3)for(const [a,b]of [[index.getX(at),index.getX(at+1)],[index.getX(at+1),index.getX(at+2)],[index.getX(at+2),index.getX(at)]]){const key=Math.min(a,b)+':'+Math.max(a,b);if(seen.has(key))continue;seen.add(key);const rest=bind[a].distanceTo(bind[b]);if(rest>=.005)edges.push({a,b,rest})}
  const centroid=points=>target.reduce((sum,i)=>sum.add(points[i]),new THREE.Vector3()).divideScalar(target.length);
  const pairs=[baseline,fixed,dominant].map(body=>{const rig=buildCharacter(CLASSES.thug.look),proc=new Animator(rig);proc.breath=0;return {body,rig,proc,anim:new MocapAnimator(body,rig)}});
  let meanOffsetTotal=0,dominantOffsetTotal=0;
  for(const pose of ['stance','run','attack','overhead','down']) {
    const state={speed:pose==='run'?5.6:0,fwd:1,onGround:true,stance:CLASSES.thug.stance,pitch:0,react:pose==='down'?{type:'down',t:.8,dur:1}:null,action:pose==='attack'?{clip:'slash1',stage:'active',t:.65,key:'proof'}:pose==='overhead'?{clip:'jumpslam',stage:'wind',t:1,key:'proof'}:null};
    for(let frame=0;frame<60;frame++)for(const pair of pairs){pair.proc.update(1/60,state);pair.anim.update(1/60,state)}
    const old=positions(baseline),current=positions(fixed),onlyLeg=positions(dominant),oldCenter=centroid(old),meanOffset=oldCenter.distanceTo(centroid(current)),dominantOffset=oldCenter.distanceTo(centroid(onlyLeg));meanOffsetTotal+=meanOffset;dominantOffsetTotal+=dominantOffset;
    const newSpikes=[];let targetMaxStretch=0;for(const edge of edges){const oldLength=old[edge.a].distanceTo(old[edge.b]),newLength=current[edge.a].distanceTo(current[edge.b]);if(newLength>oldLength+.10&&newLength>edge.rest*1.8)newSpikes.push({...edge,before:oldLength,after:newLength});if(mask[edge.a]&&mask[edge.b])targetMaxStretch=Math.max(targetMaxStretch,newLength/edge.rest)}
    __metrics.push({pose,edges:edges.length,newSpikes:newSpikes.length,worstNew:newSpikes.slice(0,10),a:10413,b:10417,rest:bind[10413].distanceTo(bind[10417]),before:old[10413].distanceTo(old[10417]),after:current[10413].distanceTo(current[10417]),dominantAfter:onlyLeg[10413].distanceTo(onlyLeg[10417]),targetMaxStretch,meanCentroidOffset:meanOffset,dominantCentroidOffset:dominantOffset,legMean,upMean});
    check(targetMaxStretch<1.05,pose+': 同片仿射运动不产生内部边拉伸');
    check(newSpikes.length===0,pose+': 全mesh无新增10cm裂口');
    check(meanOffset<.05,pose+': 保留原平均位置，未大幅漂移');
  }
  check(meanOffsetTotal<dominantOffsetTotal,'统一平均权重比纯小腿候选更接近原片运动位置');
  check(repairAttachmentWeights(fixed,'thug')===repaired&&after.geometry===geometry,'动画后重复修复仍幂等，不拿动作坐标重算绑定域');
  for(const pair of pairs)pair.anim.mixer.stopAllAction();const skinWeight=geometry.attributes.skinWeight;let disposed=0;geometry.addEventListener('dispose',()=>disposed++);splitForFirstPerson(fixed);
  const split=fixed.meshes.find(mesh=>mesh.geometry.attributes.skinWeight===skinWeight).geometry;let detached=false;split.addEventListener('dispose',()=>{detached=!Object.values(split.attributes).includes(skinWeight)});disposeRig({root:fixed.model},{sharedRoots:[source]});
  check(disposed===0&&detached&&split.attributes.skinWeight===skinWeight,'实例释放保护缓存geometry、共享skin与源GPU属性');
  for(const pair of pairs){if(pair.body!==fixed)disposeRig({root:pair.body.model},{sharedRoots:[source]});disposeRig(pair.rig)}
  disposeRig({root:shared.model},{sharedRoots:[source]});disposeRig({root:guardBody.model},{sharedRoots:[guardSource,source]});disposeRig({root:guardSource},{sharedRoots:[source]});
  document.querySelector('#result').textContent=__results.join('\n')+'\n'+JSON.stringify(__metrics,null,2);
}catch(error){__errors.push(String(error.stack||error));document.querySelector('#result').textContent=__errors.join('\n')}
window.__ready=true;
</script></body></html>
