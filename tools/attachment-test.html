<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head>
<body><pre id="result">检查中…</pre><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/GLTFLoader.js';
import { loadClipLibrary, createMocapBody, MocapAnimator, splitForFirstPerson } from '../src/game/mocap.js';
import { repairClothWeights } from '../src/game/cloth.js';
import { repairAttachmentWeights } from '../src/game/attachment.js';
import { disposeRig } from '../src/game/model.js';
window.__errors=[];window.__results=[];window.__metrics=[];
const check=(ok,label)=>{if(!ok)throw Error(label);__results.push(label)};
const weights=geometry=>Array.from({length:geometry.attributes.skinIndex.count*4},(_,i)=>[geometry.attributes.skinIndex.getComponent(Math.floor(i/4),i%4),geometry.attributes.skinWeight.getComponent(Math.floor(i/4),i%4)]);
const point=(mesh,i)=>mesh.getVertexPosition(i,new THREE.Vector3()).applyMatrix4(mesh.matrixWorld);
const update=(body,anim,state)=>{for(let i=0;i<60;i++)anim.update(1/60,state);body.model.updateMatrixWorld(true);for(const mesh of body.meshes)mesh.skeleton.update()};
try {
  await loadClipLibrary('../assets/anim/anims.glb');const loader=new GLTFLoader(),source=(await loader.loadAsync('../assets/models/rigged/skeleton.glb')).scene;
  let sourceMesh;source.traverse(object=>{if(object.isSkinnedMesh&&!sourceMesh)sourceMesh=object});const sourceGeometry=sourceMesh.geometry,sourceWeights=JSON.stringify(weights(sourceGeometry));
  const baseline=createMocapBody(source);repairClothWeights(baseline,'skeleton');
  source.userData.gloryClass='skeleton';const fixed=createMocapBody(source);if(!fixed.attachment)repairAttachmentWeights(fixed,'skeleton');
  const before=baseline.meshes[0],after=fixed.meshes[0],si=before.geometry.attributes.skinIndex,sw=before.geometry.attributes.skinWeight,ai=after.geometry.attributes.skinIndex,aw=after.geometry.attributes.skinWeight,mask=after.userData.attachmentComponent;
  check(fixed.attachment?.changed>0,'只识别骸骨卫兵已审计的独立后侧头饰与破裙');
  check(fixed.attachment.targetVertices===2743+1860+2+1434,'目标严格为2743头饰、1860破裙、2皮带端点与1434后披风');
  check(sourceMesh.geometry===sourceGeometry&&JSON.stringify(weights(sourceGeometry))===sourceWeights,'原始 GLB geometry 和权重保持不变');
  let invalid=0,protectedVertices=0,headProtected=0,skirtVertices=0,featherVertices=0,bindError=0;
  const stripEndpoints=new Set([20532,20533]);
  const names=after.skeleton.bones.map(bone=>bone.name),head=names.indexOf('Head'),neck=names.indexOf('neck'),hips=names.indexOf('Hips'),pollution=new Set(['LeftShoulder','RightShoulder','LeftArm','RightArm','LeftForeArm','RightForeArm','LeftHand','RightHand']);
  before.skeleton.update();after.skeleton.update();const neckY=baseline.bones.neck.getWorldPosition(new THREE.Vector3()).y;
  for(let i=0;i<ai.count;i++) {
    const isFeather=mask[i]&&point(before,i).y>neckY+.01;if(isFeather)featherVertices++;
    let sum=0,oldNeck=0,newNeck=0,oldHead=0,hipWeight=0;
    for(let k=0;k<4;k++) {
      const weight=aw.getComponent(i,k),index=ai.getComponent(i,k);sum+=weight;
      if(!Number.isFinite(weight)||weight<0||index>=names.length)invalid++;
      if(si.getComponent(i,k)===neck)oldNeck+=sw.getComponent(i,k);if(index===neck)newNeck+=weight;if(si.getComponent(i,k)===head)oldHead+=sw.getComponent(i,k);
      if(index===hips)hipWeight+=weight;
      if(!mask[i]&&(index!==si.getComponent(i,k)||weight!==sw.getComponent(i,k)))throw Error('非目标连通片权重意外改变 '+i);
      if(isFeather&&pollution.has(names[index])&&weight>1e-6)throw Error('目标头饰仍受肩臂影响 '+i);
    }
    if(Math.abs(sum-1)>1e-5||((!mask[i]||isFeather)&&Math.abs(oldNeck-newNeck)>1e-5))invalid++;
    if(!mask[i]){protectedVertices++;if(oldHead>.5)headProtected++;}
    else if(hipWeight>.99999)skirtVertices++;
    bindError=Math.max(bindError,point(before,i).distanceTo(point(after,i)));
  }
  check(invalid===0,'归一化权重有效、真头颈与头饰原neck过渡逐项保持');
  // 下后披风也含纯Hips目标；严格1860裙片归属由cloth-reaction独立证书逐点验证。
  __metrics.push({targetVertices:fixed.attachment.targetVertices,protectedVertices,headProtected,featherVertices,hipDominantTargetVertices:skirtVertices});
  check(protectedVertices===ai.count-6039&&headProtected>2000&&skirtVertices>=1860&&featherVertices===2743,'全部21376非目标点原样，真头颈/肩甲保留，完整2743头饰无肩臂污染');
  check([...stripEndpoints].every(i=>mask[i]&&ai.getX(i)===names.indexOf('LeftArm')&&aw.getX(i)===1),'仅20532/20533两枚皮带端点由前臂归上臂');
  check(bindError<1e-5,'绑定姿态形状保持不变');
  const shared=createMocapBody(source);check(shared.meshes[0].geometry===after.geometry,'实例复用只读头饰修复缓存');
  const ba=new MocapAnimator(baseline),fa=new MocapAnimator(fixed);
  for(const pose of ['stance','run','attack','overhead','down']) {
    const state={speed:pose==='run'?5.6:0,fwd:1,onGround:true,stance:'greatsword',pitch:0,react:pose==='down'?{type:'down',t:.8,dur:1}:null,action:pose==='attack'?{clip:'slash1',stage:'active',t:.65,key:'proof'}:pose==='overhead'?{clip:'jumpslam',stage:'wind',t:1,key:'proof'}:null};
    update(baseline,ba,state);update(fixed,fa,state);
    for(const [a,b]of [[24318,24314],[24033,24041]]) {
      const beforeLength=point(before,a).distanceTo(point(before,b)),afterLength=point(after,a).distanceTo(point(after,b));
      __metrics.push({pose,a,b,before:beforeLength,after:afterLength,improvement:beforeLength/afterLength});
      check(afterLength<.035&&afterLength<beforeLength*.35,pose+': 已证实头饰污染断边收敛');
    }
  }
  ba.mixer.stopAllAction();fa.mixer.stopAllAction();const geo=after.geometry,skinWeight=geo.attributes.skinWeight;let cachedDisposed=0;geo.addEventListener('dispose',()=>cachedDisposed++);
  splitForFirstPerson(fixed);const splitGeometry=fixed.meshes.find(mesh=>mesh.geometry.attributes.skinWeight===skinWeight).geometry;let retained=false;splitGeometry.addEventListener('dispose',()=>{retained=!Object.values(splitGeometry.attributes).includes(skinWeight)});
  disposeRig({root:fixed.model},{sharedRoots:[source]});check(cachedDisposed===0&&retained&&splitGeometry.attributes.skinWeight===skinWeight,'释放实例保护头饰缓存及共享蒙皮缓冲');
  disposeRig({root:baseline.model},{sharedRoots:[source]});disposeRig({root:shared.model},{sharedRoots:[source]});
  const unrelated=(await loader.loadAsync('../assets/models/rigged/swordmaster.glb')).scene;unrelated.userData.gloryClass='swordmaster';const other=createMocapBody(unrelated);check(!other.attachment&&!repairAttachmentWeights(other,'swordmaster'),'未审计职业不会进入服饰专用修复');disposeRig({root:other.model},{sharedRoots:[unrelated]});
  document.querySelector('#result').textContent=__results.join('\n')+'\n'+JSON.stringify(__metrics,null,2);
}catch(error){__errors.push(String(error.stack||error));document.querySelector('#result').textContent=__errors.join('\n')}
window.__ready=true;
</script></body></html>
