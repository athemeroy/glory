<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level Preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #202731; }
  canvas { display: block; }
  #info { position: fixed; left: 8px; top: 6px; color: #fff; font: 12px/1.45 ui-monospace, Menlo, monospace; text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none; }
</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
</head>
<body>
<div id="info"></div>
<script type="module">
// 关卡预览：?level=training|courtyard|coldiron|arena
//   &cam=x,y,z,tx,ty,tz  指定相机；&view=N 使用关卡预设视角；缺省在 spawns.player 眼高处朝向 yaw
//   &debug=1 碰撞盒线框；&markers=1 出生点/标记；&quality=low；&exp=1.0 曝光；&fov=70；&frames=3（渲染帧数，0=持续动画）
//   &hud=0 隐藏信息；&t=秒（动画时间）；&gate=open 预先开门（coldiron）
import * as THREE from 'three';
import { buildLevel } from '../src/game/levels.js';

const q = new URLSearchParams(location.search);
const id = q.get('level') || 'training';
const quality = q.get('quality') || 'high';
const info = document.getElementById('info');
if (q.get('hud') === '0') info.style.display = 'none';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +(q.get('exp') || 1);
document.body.appendChild(renderer.domElement);
renderer.info.autoReset = false;

const names = ['stone', 'wood', 'iron', 'cloth', 'leather', 'bronze'];
const texCache = {};
const loader = new THREE.TextureLoader();
await Promise.all(names.map(n => new Promise(res => {
  loader.load(`../assets/tex/${n}.jpg`, t => {
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy(); texCache[n] = t; res();
  }, undefined, () => { console.warn('tex fail', n); texCache[n] = new THREE.Texture(); res(); });
})));

const ctx = { THREE, renderer, tex: n => texCache[n], quality, noEnv: q.get('noenv') === '1', debugSkip: (q.get('skip') || '').split(',').filter(Boolean) };
const scene = new THREE.Scene();
const t0 = performance.now();
const L = buildLevel(id, ctx);
const buildMs = performance.now() - t0;
scene.add(L.group);
scene.background = L.background || null;
scene.fog = L.fog || null;
if (q.get('gate') === 'open' && L.openGate) { L.openGate(); for (let i = 0; i < 60; i++) L.update(0.05, i * 0.05); }

const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 70), innerWidth / innerHeight, 0.1, 1500);
const VIEWS = {
  training: [[-1.2, 1.62, -0.3, -5.9, 1.4, -0.2], [5.2, 1.7, 6.8, -3, 1.4, -4], [-4.6, 1.7, 6.5, 3.5, 1.2, -4.5], [0, 7.5, 7.5, 0, 0, -1]],
  courtyard: [[0, 1.62, 12, 0, 1.2, -12], [0, 1.62, -12, 0, 1.2, 12], [-22, 6, 16, 10, 0, -6], [18, 2.0 + 1.62, 0, -10, 1, 0], [0, 40, 30, 0, 0, 0]],
  coldiron: [[0, 1.62, 47, 0, 1.6, 10], [0, 1.62, 13, 0, 2, -8], [-7, 2.2, -5, 6, 1.5, 6], [0, 30, 40, 0, 0, 5]],
  arena: [[-16, 1.62, 0, 16, 1.2, 0], [16, 1.62, 0, -16, 1.2, 0], [-14, 9, 14, 6, 0, -6], [0, 55, 38, 0, 0, 0]],
};
let cam = q.get('cam');
const view = q.get('view');
if (!cam && view !== null && VIEWS[id] && VIEWS[id][+view]) cam = VIEWS[id][+view].join(',');
if (cam) {
  const c = cam.split(',').map(Number);
  camera.position.set(c[0], c[1], c[2]);
  camera.lookAt(c[3], c[4], c[5]);
} else {
  const p = L.spawns.player;
  camera.position.set(p[0], p[1] + 1.62, p[2]);
  camera.lookAt(p[0] + Math.sin(p[3]) * 10, p[1] + 1.3, p[2] + Math.cos(p[3]) * 10);
}

// 碰撞盒线框
if (q.get('debug') === '1') {
  const pos = [];
  const e = [[0, 1], [1, 3], [3, 2], [2, 0], [4, 5], [5, 7], [7, 6], [6, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
  for (const c of L.colliders) {
    const v = [];
    for (let i = 0; i < 8; i++) v.push([i & 1 ? c.max[0] : c.min[0], i & 2 ? c.max[1] : c.min[1], i & 4 ? c.max[2] : c.min[2]]);
    for (const [a, b] of e) pos.push(...v[a], ...v[b]);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const colLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xff3355, depthTest: false, transparent: true, opacity: 0.8 }));
  colLines.renderOrder = 999;
  scene.add(colLines);
  const b = L.bounds;
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.Float32BufferAttribute([b.minX, 0.05, b.minZ, b.maxX, 0.05, b.minZ, b.maxX, 0.05, b.minZ, b.maxX, 0.05, b.maxZ, b.maxX, 0.05, b.maxZ, b.minX, 0.05, b.maxZ, b.minX, 0.05, b.maxZ, b.minX, 0.05, b.minZ], 3));
  const bl = new THREE.LineSegments(bg, new THREE.LineBasicMaterial({ color: 0xffee00, depthTest: false }));
  bl.renderOrder = 999; scene.add(bl);
}

// 出生点/标记：简易人偶（胶囊+头），头放图层 1（只镜子可见，模拟本地玩家）
function dummyFigure(color, x, y, z, yaw, headLayer = 0) {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.9, 4, 12), m); body.position.y = 0.85; body.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 12), m); head.position.y = 1.6; head.castShadow = true; head.layers.set(headLayer);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.25, 8), new THREE.MeshStandardMaterial({ color: 0xcf624b }));
  nose.rotation.x = Math.PI / 2; nose.position.set(0, 1.25, 0.32);
  g.add(body, head, nose); g.position.set(x, y, z); g.rotation.y = yaw;
  scene.add(g);
}
if (q.get('markers') === '1') {
  const colors = [0x4d9d9a, 0xcf624b, 0xa98954, 0xe7e2d7];
  let ci = 0;
  for (const [k, v] of Object.entries(L.spawns)) {
    const list = Array.isArray(v[0]) ? v : [v];
    const col = colors[ci++ % colors.length];
    for (const s of list) dummyFigure(col, s[0], s[1], s[2], s[3], k === 'player' ? 1 : 0);
  }
  const mk = L.markers || {};
  const pin = (x, z, color, h = 2.5) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, h, 8), new THREE.MeshBasicMaterial({ color })); m.position.set(x, h / 2, z); scene.add(m); };
  (mk.dummies || []).forEach(d => dummyFigure(0x8b6b4a, d[0], 0, d[1], d[2]));
  (mk.mobs || []).forEach(d => pin(d[0], d[1], 0xff5533));
  if (mk.bossCenter) pin(mk.bossCenter[0], mk.bossCenter[1], 0xffff00, 5);
}

camera.layers.enable(0); camera.layers.enable(2);
if (q.get('probe') === '1') {
  const d = new THREE.Vector3(); camera.getWorldDirection(d);
  for (const [r, m, dx] of [[0.05, 1, -0.6], [0.6, 0, 0.6]]) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: r, metalness: m, envMap: L.environment }));
    const side = new THREE.Vector3().crossVectors(d, camera.up).normalize();
    s.position.copy(camera.position).addScaledVector(d, 3).addScaledVector(side, dx);
    scene.add(s);
  }
}

const frames = q.get('frames') === null ? 3 : +q.get('frames');
const tBase = +(q.get('t') || 1.5);
let n = 0, last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
function hud() {
  if (q.get('hud') === '0') return;
  const ri = renderer.info.render;
  info.textContent = `${L.name} (${id})  quality=${quality}\nbuild ${buildMs.toFixed(0)}ms  calls ${ri.calls}  tris ${(ri.triangles / 1000).toFixed(1)}k  colliders ${L.colliders.length}` +
    `\npointLights ${countLights()}  cam ${camera.position.toArray().map(v => v.toFixed(1)).join(',')}` + (frames === 0 ? `  fps ${fps.toFixed(0)}` : '');
}
function countLights() { let c = 0; L.group.traverse(o => { if (o.isPointLight) c++; }); return c; }
function frame() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  L.update(dt, frames === 0 ? now / 1000 : tBase + n * 0.016);
  renderer.info.reset();
  renderer.render(scene, camera);
  hud();
  n++;
  if (frames === 0 || n < frames) requestAnimationFrame(frame);
  else window.__ready = true;
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.__level = L; window.__scene = scene; window.__camera = camera; window.__renderer = renderer;
requestAnimationFrame(frame);
if (frames === 0) window.__ready = true;
</script>
</body>
</html>
