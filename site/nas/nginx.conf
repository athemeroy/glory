server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # 相对重定向，保留客户端端口(47080)

    include /etc/nginx/mime.types;
    types { application/javascript mjs; font/woff2 woff2; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    # 视频支持拖动（nginx 静态文件默认支持 Range）
    location /media/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    # 模型与贴图较大，缓存一天；页面与脚本短缓存，更新后手机能及时拿到新版
    location ~* \.(glb|jpg|png|webp|woff2|mp3|wav)$ {
        expires 1d;
    }
    location ~* \.(html|js|css)$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }
}
