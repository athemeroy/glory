services:
  glory:
    image: nginx:alpine
    container_name: glory
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glory.rule=Host(`glory.naszqun.com`)"
      - "traefik.http.routers.glory.entrypoints=web"
      - "traefik.http.services.glory.loadbalancer.server.port=80"
    environment:
      - TZ=Asia/Shanghai

networks:
  traefik_net:
    external: true
