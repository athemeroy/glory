<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旁白试听 · 荣耀</title>
<meta name="theme-color" content="#0d0c0a">
<style>
@font-face { font-family: GlorySerif; src: url(fonts/glory-serif.woff2) format('woff2'); font-display: swap; }
:root { --bg: #0d0c0a; --card: #1b1813; --gold: #e8b75a; --gold2: #f3d69a; --ink: #f1e7d2; --mute: #b7aa8c; --dim: #8a7f69; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
a { color: var(--gold2); }
.back { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; }
h1 { margin: 8px 0 4px; font: 900 30px/1.3 GlorySerif, "Songti SC", serif; letter-spacing: .1em; color: var(--gold2); }
.lead { color: var(--mute); margin: 0 0 20px; }
.line { padding: 12px 16px; border-left: 2px solid var(--gold); background: rgba(232, 183, 90, .06); color: var(--ink); margin-bottom: 20px; }
.v { background: var(--card); border: 1px solid rgba(232, 183, 90, .14); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.v.cur { border-color: var(--gold); }
.v .h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.v b { font-size: 18px; color: var(--gold2); }
.v span { color: var(--mute); font-size: 15px; }
.v em { font-style: normal; font-size: 13px; padding: 1px 8px; border-radius: 6px; background: var(--gold); color: #1a140a; }
.v em.old { background: #4a4336; color: var(--ink); }
audio { width: 100%; height: 44px; margin-top: 10px; }
.note { color: var(--dim); font-size: 14px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← 返回首页</a>
  <h1>旁白音色试听</h1>
  <p class="lead">宣传片旁白用 Gemini 3.8 Flash TTS 配音。下面是同一句台词、同一种讲述风格（自然沉稳，不刻意压嗓）在不同音色下的效果。</p>
  <div class="line">《全职高手》里的那款网游，现在，就在你的浏览器里。</div>

  <div class="v cur"><div class="h"><b>Charon</b><span>男 · 沉稳、讲述感</span><em>宣传片当前使用</em></div><audio controls preload="none" src="voices/Charon.mp3"></audio></div>
  <div class="v"><div class="h"><b>Iapetus</b><span>男 · 清晰、干净</span></div><audio controls preload="none" src="voices/Iapetus.mp3"></audio></div>
  <div class="v"><div class="h"><b>Algieba</b><span>男 · 圆润、顺滑</span></div><audio controls preload="none" src="voices/Algieba.mp3"></audio></div>
  <div class="v"><div class="h"><b>Sadaltager</b><span>男 · 知性</span></div><audio controls preload="none" src="voices/Sadaltager.mp3"></audio></div>
  <div class="v"><div class="h"><b>Schedar</b><span>男 · 平稳</span></div><audio controls preload="none" src="voices/Schedar.mp3"></audio></div>
  <div class="v"><div class="h"><b>Gacrux</b><span>女 · 成熟</span></div><audio controls preload="none" src="voices/Gacrux.mp3"></audio></div>
  <div class="v"><div class="h"><b>Vindemiatrix</b><span>女 · 温柔</span></div><audio controls preload="none" src="voices/Vindemiatrix.mp3"></audio></div>
  <div class="v"><div class="h"><b>Orus</b><span>男 · 旧版（低沉史诗风格）</span><em class="old">已换掉</em></div><audio controls preload="none" src="voices/Orus-old.mp3"></audio></div>

  <p class="note">想换成哪个，告诉我名字就行：会用它重配全部 11 句旁白并重新渲染宣传片。</p>
</div>
</body>
</html>
